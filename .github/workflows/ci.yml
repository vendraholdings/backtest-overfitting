name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python scripts/run_all.py --quick
      - run: uv run python scripts/make_figures.py
      - run: uv run python scripts/build_paper.py
      - run: uv run python site/build.py
